<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qymera Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:#f5f7fa;color:#1a1d21;min-height:100vh}
header{background:#1a1d21;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:1.1rem;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#ef4444}
.dot.ok{background:#22c55e}
#sysInfo{font-size:0.75rem;color:#a3a9b4}
nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid #e2e8f0;overflow-x:auto;white-space:nowrap}
.tab{padding:8px 16px;border:none;background:transparent;color:#475569;font-size:0.85rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:#1a1d21}.tab.active{color:#2563eb;border-bottom-color:#2563eb}
main{padding:16px}
.card{background:#fff;border-radius:8px;border:1px solid #e2e8f0;padding:16px;margin-bottom:16px}
h2{font-size:0.9rem;font-weight:600;color:#334155;margin-bottom:12px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-header h2{margin-bottom:0}
.grid{display:grid;gap:12px}.grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.metric{font-size:1.5rem;font-weight:600}
.entity{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0}
.entity-info{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.entity-name{font-weight:500;font-size:0.85rem;word-break:break-word}
.entity-meta{font-size:0.7rem;color:#64748b}
.btn{padding:6px 12px;border:none;border-radius:4px;font-size:0.75rem;font-weight:500;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#2563eb;color:#fff}.btn-danger{background:#ef4444;color:#fff}.btn-ghost{background:#f1f5f9;color:#475569}
.toggle{position:relative;width:44px;height:24px;background:#cbd5e1;border:none;border-radius:12px;cursor:pointer}
.toggle.on{background:#22c55e}.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:0.2s}
.toggle.on::after{left:22px}
.slider{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:#e2e8f0;border-radius:3px;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;background:#2563eb;border-radius:50%;cursor:pointer}
input,select{width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#1a1d21;font-size:0.8rem}
label{display:block;font-size:0.7rem;color:#475569;margin:8px 0 4px}
.form-row{display:flex;gap:12px}.form-row>div{flex:1}
.log-entry{font-family:monospace;font-size:0.7rem;padding:6px 10px;background:#f8fafc;border-radius:4px;margin-bottom:4px;border-left:3px solid #2563eb;word-break:break-word;display:flex;gap:6px;flex-wrap:wrap}
.log-entry.ERROR{border-left-color:#ef4444}.log-entry.WARNING{border-left-color:#f59e0b}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:0.65rem;font-weight:600}
.badge-online{background:#dcfce7;color:#166534}.badge-offline{background:#fee2e2;color:#991b1b}
.badge-pending{background:#fef3c7;color:#92400e}.badge-confirmed{background:#dbeafe;color:#1e40af}.badge-error{background:#fee2e2;color:#991b1b}
.badge-enabled{background:#dcfce7;color:#166534}.badge-disabled{background:#fee2e2;color:#991b1b}
.badge-local{background:#e0e7ff;color:#3730a3}.badge-remote{background:#ede9fe;color:#5b21b6}
.empty{color:#94a3b8;font-size:0.85rem;padding:8px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#991b1b;color:#fff;padding:10px 14px;border-radius:6px;font-size:0.8rem;z-index:99;max-width:90vw;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:none;overflow-y:auto;padding:24px}
#overlay .card{max-width:720px;margin:0 auto}
@media(max-width:640px){header h1{font-size:1rem}main{padding:12px}.form-row{flex-direction:column;gap:0}}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="statusDot"></span>Qymera Dashboard <span id="netLabel" style="font-size:0.7rem;color:#a3a9b4"></span></h1>
  <div id="sysInfo">—</div>
</header>
<nav id="navTabs">
  <button class="tab active" data-tab="dashboard">Dashboard</button>
  <button class="tab" data-tab="devices">Devices</button>
  <button class="tab" data-tab="entities">Entities</button>
  <button class="tab" data-tab="rules">Rules</button>
  <button class="tab" data-tab="skills">Skills</button>
  <button class="tab" data-tab="logs">Logs</button>
  <button class="tab" data-tab="system">System</button>
  <button class="tab" data-tab="network">Network</button>
</nav>
<main id="mainContent"></main>
<div id="toast"></div>
<div id="overlay"></div>
<script>
"use strict";
var API='/api/v1';
var main=document.getElementById('mainContent');
var toastEl=document.getElementById('toast');
var overlayEl=document.getElementById('overlay');

/* =====================================================================
 * UI state is kept apart from the DOM. DOM attributes are only used for
 * bindings (data-field / data-action / data-*key), never for source data.
 * ===================================================================== */
var uiState={
  activeView:'dashboard',
  formActive:false,
  editingRuleId:null,
  pending:new Set()
};

/* =====================================================================
 * Tiny DOM update helpers - each skips the DOM write when unchanged.
 * ===================================================================== */
function setText(node,value){
  if(!node) return;
  var next=String(value==null?'':value);
  if(node.textContent!==next) node.textContent=next;
}
function setClass(node,cls,on){
  if(!node) return;
  if(on) node.classList.add(cls); else node.classList.remove(cls);
}
function setDisabled(node,d){
  if(!node) return;
  if(node.disabled!==!!d) node.disabled=!!d;
}
function setAttr(node,name,value){
  if(!node) return;
  var next=String(value==null?'':value);
  if(node.getAttribute(name)!==next) node.setAttribute(name,next);
}
function setValue(node,value){
  if(!node) return;
  var next=String(value==null?'':value);
  if(node.value!==next) node.value=next;
}

/* DOM builder: minimal, no framework. */
function el(tag,attrs,children){
  var n=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(!Object.prototype.hasOwnProperty.call(attrs,k)) continue;
    if(k==='class') n.className=attrs[k];
    else if(k==='text') n.textContent=attrs[k];
    else n.setAttribute(k,attrs[k]);
  }
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null) return;
      n.appendChild(typeof c==='string'?document.createTextNode(c):c);
    });
  }
  return n;
}
function insertAt(container,node,idx){
  var kids=container.children;
  if(idx>=kids.length) container.appendChild(node);
  else container.insertBefore(node,kids[idx]);
}

/* reconcileCollection(container, list, keyFn, attr, create, apply)
 * In-place diff: existing key -> apply() in place; new key -> create one
 * node; missing key -> remove one node. Order is preserved. Never wipes or
 * rebuilds the container, so focus/unpersisted DOM state survives refresh.
 * `attr` is the stable-key attribute (data-*-key) on each child node. */
function reconcileCollection(container,list,keyFn,attr,create,apply){
  var byKey={};
  list.forEach(function(it){ byKey[keyFn(it)]=it; });
  Array.prototype.slice.call(container.children).forEach(function(node){
    var k=node.getAttribute(attr);
    if(k==null||!byKey[k]) container.removeChild(node);
  });
  var kids=container.children;
  list.forEach(function(it,idx){
    var k=keyFn(it);
    var node=null;
    Array.prototype.some.call(kids,function(n){ if(n.getAttribute(attr)===k){node=n;return true;} return false; });
    if(!node){
      node=create(it);
      node.setAttribute(attr,k);
      apply(it,node);
      insertAt(container,node,idx);
    } else {
      apply(it,node);
      if(kids[idx]!==node) container.insertBefore(node,kids[idx]||null);
    }
  });
}

/* =====================================================================
 * API + online status
 * ===================================================================== */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtBool(v){ return v===true?'ON':(v===false?'OFF':esc(v)); }
function fmtTs(sec){ if(!sec) return '—'; return new Date(sec*1000).toLocaleTimeString(); }
function badgeForStatus(s){
  if(!s) return '';
  var st=String(s);
  if(st==='STATE_CONFIRMED'||st==='CONFIRMED') return 'badge-confirmed';
  if(st==='FAILED'||st==='TIMEOUT') return 'badge-error';
  return 'badge-pending';
}
function apiFetch(path,opts){
  opts=opts||{};
  var ctrl=new AbortController();
  var t=setTimeout(function(){ctrl.abort();},8000);
  var init={headers:{'Content-Type':'application/json'},signal:ctrl.signal};
  if(opts.method){ init.method=opts.method; }
  if(opts.body){ init.body=opts.body; }
  return fetch(API+path,init).then(function(r){
      clearTimeout(t);
      return r.text().then(function(txt){
        var j=null;
        try{ j=JSON.parse(txt); }catch(e){ j=null; }
        if(!j){ throw new Error('Invalid JSON response from '+path); }
        if(!j.ok){ throw new Error((j.error&&j.error.code?j.error.code+': ':'')+(j.error&&j.error.message?j.error.message:'request failed')); }
        return j.data;
      });
    }).catch(function(e){
      clearTimeout(t);
      if(e&&e.name==='AbortError') throw new Error('Timeout: '+path+' unreachable');
      throw e;
    });
}
var statusDot=document.getElementById('statusDot');
var sysInfoEl=document.getElementById('sysInfo');
var netLabelEl=document.getElementById('netLabel');
function setOnline(b){
  statusDot.className=b?'dot ok':'dot';
  sysInfoEl.textContent=b?'':'OFFLINE';
}
function setNetLabel(txt){ netLabelEl.textContent=txt; }
/* Human label for the connection the device is currently hosting. */
function netLabelFor(s){
  if(!s||!s.network) return '';
  return s.network==='AP'||s.network==='APSTA'?('AP · '+(s.ssid||'')):'STA';
}
var toastTimer;
function showError(err){
  toastEl.textContent='Error: '+(err&&err.message?err.message:'unknown');
  toastEl.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ toastEl.style.display='none'; },4000);
}

/* =====================================================================
 * Polling engine: active view only + request dedup + stale protection.
 * Each view keeps: gen (stale-response check), inflight (dedup), mount/refresh/update.
 * ===================================================================== */
var views={};
var navTabs=document.getElementById('navTabs');
function makeRefresh(path,viewName){
  return function(gen){
    return apiFetch(path).then(function(data){
      if(gen===views[viewName].gen){
        setOnline(true);
        views[viewName].update(data);
      }
    });
  };
}
function runViewRefresh(v){
  if(!v||!v.refresh||v.inflight) return;
  if(v.pollable===false) return;
  if(uiState.formActive) return;
  if(typeof v.gen!=='number') v.gen=0;
  v.inflight=true;
  var gen=++v.gen;
  v.refresh(gen).then(function(){ v.inflight=false; })
    .catch(function(){ v.inflight=false; setOnline(false); });
}
function showView(name){
  uiState.activeView=name;
  var v=views[name];
  Array.prototype.forEach.call(navTabs.querySelectorAll('.tab'),function(b){
    setClass(b,'active',b.getAttribute('data-tab')===name);
  });
  var host=document.getElementById('view-'+name);
  if(!host){
    host=document.createElement('div');
    host.id='view-'+name;
    main.appendChild(host);
    v.host=host;
    if(v.mount) v.mount(host);
  }
  Object.keys(views).forEach(function(n){
    var h=document.getElementById('view-'+n);
    if(h) h.style.display=(n===name)?'':'none';
  });
  if(v.refresh&&v.pollable!==false) runViewRefresh(v);
}
/* Single consistent poll interval; only the active view is fetched, and a
 * view that is a form (uiState.formActive) is skipped so typing survives. */
function pollTick(){
  var v=views[uiState.activeView];
  if(v&&v.refresh&&v.pollable!==false&&!uiState.formActive) runViewRefresh(v);
}

/* =====================================================================
 * DASHBOARD view
 * ===================================================================== */
views.dashboard={
  mount:function(host){
    host.innerHTML=
      '<div class="section-header"><h2>Qymera Dashboard</h2></div>'+
      '<div class="grid grid-3">'+
      '<div class="card"><h2>Status</h2><div class="metric"><span class="badge badge-online">ONLINE</span></div></div>'+
      '<div class="card"><h2>IP Address</h2><div class="metric" data-field="ip">—</div></div>'+
      '<div class="card"><h2>Free Heap</h2><div class="metric" data-field="heap">—</div></div>'+
      '<div class="card"><h2>Uptime</h2><div class="metric" data-field="uptime">—</div></div>'+
      '<div class="card"><h2>Device Count</h2><div class="metric" data-field="device_count">—</div></div>'+
      '<div class="card"><h2>Entity Count</h2><div class="metric" data-field="entity_count">—</div></div>'+
      '</div>';
    var f={};
    ['ip','heap','uptime','device_count','entity_count'].forEach(function(n){
      f[n]=host.querySelector('[data-field="'+n+'"]');
    });
    this.__f=f;
  },
  refresh:makeRefresh('/status','dashboard'),
  update:function(s){
    var f=this.__f;
    setNetLabel(netLabelFor(s));
    setText(f.ip,s.ip||'—');
    setText(f.heap,s.free_heap+' B');
    setText(f.uptime,Math.floor(s.uptime_ms/1000)+'s');
    setText(f.device_count,s.device_count);
    setText(f.entity_count,s.entity_count);
  }
};

/* =====================================================================
 * DEVICES view
 * ===================================================================== */
function deviceCardNew(){ return el('div',{'class':'card','data-device-key':''}); }
function updateDeviceCard(dev,node){
  var local=(dev.role==='dashboard');
  var mode=local?'LOCAL':'REMOTE';
  var state=dev.state?String(dev.state):(dev.online?'operational':'offline');
  if(!node.__built){
    node.innerHTML=''+
      '<h2></h2>'+
      '<div class="entity"><div class="entity-info">'+
      '<span class="entity-name" data-field="id"></span>'+
      '<span class="entity-meta" data-field="meta"></span></div>'+
      '<span class="badge" data-field="online"></span></div>'+
      '<div style="margin-top:8px"><span class="entity-meta" data-field="state"></span></div>';
    node.__built=true;
  }
  var h2=node.querySelector('h2');
  h2.textContent='';
  h2.appendChild(el('span',{'text':esc(dev.name)}));
  h2.appendChild(el('span',{'class':'badge '+(local?'badge-local':'badge-remote'),'text':mode}));
  setText(node.querySelector('[data-field="id"]'),'ID: '+dev.device_id);
  setText(node.querySelector('[data-field="meta"]'),'Model: '+(dev.model||'')+' | Location: '+(dev.location||'—')+' | Role: '+(dev.role||'—'));
  setText(node.querySelector('[data-field="state"]'),'State: '+esc(state));
  var ob=node.querySelector('[data-field="online"]');
  setText(ob,dev.online?'Online':'Offline');
  setClass(ob,'badge-online',!!dev.online);
  setClass(ob,'badge-offline',!dev.online);
}
views.devices={
  mount:function(host){
    host.innerHTML='<div class="section-header"><h2>Devices (<span data-field="count">0</span>)</h2></div><div id="deviceList" class="grid grid-2"></div>';
    this.__list=host.querySelector('#deviceList');
    this.__count=host.querySelector('[data-field="count"]');
  },
  refresh:makeRefresh('/devices','devices'),
  update:function(d){
    var list=d||[];
    setText(this.__count,list.length);
    reconcileCollection(this.__list,list,function(x){return x.device_id;},'data-device-key',deviceCardNew,updateDeviceCard);
  }
};

/* =====================================================================
 * ENTITIES view (architectural reference: incremental + event delegation)
 * ===================================================================== */
function entityCardNew(){ return el('div',{'class':'card','data-entity-key':''}); }
function updateEntityCard(ent,node){
  var key=ent.device_id+'/'+ent.entity_id;
  if(!node.__built){
    node.innerHTML=''+
      '<h2></h2>'+
      '<div class="entity"><div class="entity-info">'+
      '<span class="entity-name" data-field="devkey"></span>'+
      '<span class="entity-meta" data-field="meta"></span></div>'+
      '<div style="display:flex;flex-direction:column;gap:4px;min-width:120px;align-items:flex-end">'+
      '<span class="entity-meta" data-field="cmds"></span>'+
      '<span class="entity-meta" data-field="reliability"></span></div></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px">'+
      '<span class="entity-meta" data-field="values"></span>'+
      '<span data-control></span></div>';
    node.__built=true;
  }
  var h2=node.querySelector('h2');
  h2.textContent='';
  h2.appendChild(el('span',{'text':esc(ent.name)}));
  h2.appendChild(el('span',{'class':'entity-meta','text':' ('+esc(ent.device_id)+')'}));
  setText(node.querySelector('[data-field="devkey"]'),'ID: '+esc(key));
  setText(node.querySelector('[data-field="meta"]'),
    'Type: '+(ent.type||'')+' | Caps: '+((ent.capabilities||[]).join(', '))+' | Unit: '+(ent.unit||''));
  var cmds=node.querySelector('[data-field="cmds"]');
  cmds.textContent='Cmd: ';
  var b=el('span',{'class':'badge '+badgeForStatus(ent.cmd_status)});
  setText(b,ent.cmd_status||'—');
  cmds.appendChild(b);
  setText(node.querySelector('[data-field="reliability"]'),'Reliability: '+(ent.reliability==null?'':ent.reliability));
  setText(node.querySelector('[data-field="values"]'),'Current: '+fmtBool(ent.current)+'  Desired: '+fmtBool(ent.desired));
  updateEntityControl(ent,node);
}
function updateEntityControl(ent,node){
  var key=ent.device_id+'/'+ent.entity_id;
  var caps=ent.capabilities||[];
  var isRelay=caps.indexOf('actuator.relay')>=0;
  var isDimmer=caps.indexOf('actuator.dimmer')>=0;
  var type=isRelay?'relay':(isDimmer?'dimmer':'none');
  var holder=node.querySelector('[data-control]');
  var busy=uiState.pending.has(key);
  if(node.__ctlType!==type){
    holder.innerHTML='';
    if(type==='relay'){
      node.__ctl=el('button',{'class':'toggle','data-action':'toggle','data-k':key,'aria-label':'toggle'});
      holder.appendChild(node.__ctl);
    } else if(type==='dimmer'){
      node.__ctl=el('input',{'type':'range','class':'slider','min':'0','max':'100','data-action':'dimmer','data-k':key});
      holder.appendChild(node.__ctl);
    } else {
      node.__ctl=null;
      holder.appendChild(document.createTextNode(fmtBool(ent.desired)));
    }
    node.__ctlType=type;
  }
  var ctl=node.__ctl;
  if(type==='relay'){
    setClass(ctl,'on',ent.desired===true);
    setAttr(ctl,'data-want',ent.desired===true?'1':'0');
    setDisabled(ctl,busy);
  } else if(type==='dimmer'){
    setDisabled(ctl,busy);
    var lv=(typeof ent.desired==='number')?ent.desired:(ent.current||0);
    /* Suppress echo while the user is dragging so the thumb does not jump. */
    if(ctl!==document.activeElement) setValue(ctl,lv);
  }
}
function handleToggle(t){
  if(t.disabled) return;
  var key=t.getAttribute('data-k');
  var kv=key.split('/');
  var want=(t.getAttribute('data-want')==='1');
  t.disabled=true; uiState.pending.add(key);
  apiFetch('/control/relay',{method:'POST',body:JSON.stringify({device_id:kv[0],entity_id:kv[1],value:!want})})
    .then(function(){ uiState.pending.delete(key); runViewRefresh(views.entities); })
    .catch(function(e){ uiState.pending.delete(key); showError(e); });
}
function handleDimmer(s){
  if(s.disabled) return;
  var key=s.getAttribute('data-k');
  var kv=key.split('/');
  s.disabled=true; uiState.pending.add(key);
  apiFetch('/control/dimmer',{method:'POST',body:JSON.stringify({device_id:kv[0],entity_id:kv[1],level:parseInt(s.value,10)})})
    .then(function(){ uiState.pending.delete(key); runViewRefresh(views.entities); })
    .catch(function(e){ uiState.pending.delete(key); showError(e); });
}
views.entities={
  mount:function(host){
    host.innerHTML='<div class="section-header"><h2>Entities (<span data-field="count">0</span>)</h2></div><div id="entityList" class="grid grid-2"></div>';
    this.__list=host.querySelector('#entityList');
    this.__count=host.querySelector('[data-field="count"]');
    /* Event delegation: installed once at mount, never re-attached. */
    host.addEventListener('click',function(e){
      var t=e.target.closest?e.target.closest('[data-action="toggle"]'):null;
      if(t){ e.preventDefault(); handleToggle(t); }
    });
    host.addEventListener('change',function(e){
      var s=e.target.closest?e.target.closest('[data-action="dimmer"]'):null;
      if(s) handleDimmer(s);
    });
  },
  refresh:makeRefresh('/entities','entities'),
  update:function(d){
    var list=d||[];
    setText(this.__count,list.length);
    reconcileCollection(this.__list,list,function(x){return x.device_id+'/'+x.entity_id;},'data-entity-key',entityCardNew,updateEntityCard);
  }
};

/* =====================================================================
 * RULES view (collection refreshed incrementally; editor is an overlay)
 * ===================================================================== */
function ruleBrief(rule){
  if(rule.trigger&&rule.trigger.length){
    var t=rule.trigger[0];
    if(t&&t.entity) return esc(t.entity.device_id+'/'+t.entity.entity_id)+' '+(t.operator?esc(t.operator):'')+' '+esc(t.threshold);
  }
  return '—';
}
function ruleCardNew(){ return el('div',{'class':'card','data-rule-key':''}); }
function updateRuleCard(rule,node){
  if(!node.__built){
    node.innerHTML=''+
      '<h2></h2>'+
      '<div class="entity"><div class="entity-info">'+
      '<span class="entity-name" data-field="id"></span>'+
      '<span class="entity-meta" data-field="meta"></span>'+
      '<span class="entity-meta" data-field="trigger"></span></div>'+
      '<span class="badge" data-field="enabled"></span></div>'+
      '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" data-action="edit-rule">Edit</button>'+
      '<button class="btn" data-action="toggle-rule">Toggle</button>'+
      '<button class="btn btn-danger" data-action="del-rule">Delete</button></div>';
    node.__built=true;
  }
  var h2=node.querySelector('h2');
  h2.textContent='';
  h2.appendChild(el('span',{'text':esc(rule.name)}));
  setText(node.querySelector('[data-field="id"]'),'ID: '+rule.rule_id);
  setText(node.querySelector('[data-field="meta"]'),'Revision: '+(rule.revision||0));
  setText(node.querySelector('[data-field="trigger"]'),'Trigger: '+(rule.trigger&&rule.trigger.length?ruleBrief(rule):'—'));
  var eb=node.querySelector('[data-field="enabled"]');
  setText(eb,rule.enabled?'Enabled':'Disabled');
  setClass(eb,'badge-enabled',!!rule.enabled);
  setClass(eb,'badge-disabled',!rule.enabled);
  node.querySelector('[data-action="edit-rule"]').setAttribute('data-rule',rule.rule_id);
  var tb=node.querySelector('[data-action="toggle-rule"]');
  tb.setAttribute('data-rule',rule.rule_id);
  setText(tb,rule.enabled?'Disable':'Enable');
  setClass(tb,'btn-danger',!!rule.enabled);
  setClass(tb,'btn-primary',!rule.enabled);
  node.querySelector('[data-action="del-rule"]').setAttribute('data-rule',rule.rule_id);
}
views.rules={
  mount:function(host){
    host.innerHTML='<div class="section-header"><h2>Rules (<span data-field="count">0</span>)</h2>'+
      '<button class="btn btn-primary" data-action="new-rule">Create Rule</button></div><div id="ruleList"></div>';
    this.__list=host.querySelector('#ruleList');
    this.__count=host.querySelector('[data-field="count"]');
    host.addEventListener('click',function(e){
      var t=null;
      if(e.target.closest) t=e.target.closest('[data-action]');
      if(!t) return;
      var a=t.getAttribute('data-action');
      if(a==='new-rule') openRuleEditor(null);
      else if(a==='edit-rule') openRuleEditor(t.getAttribute('data-rule'));
      else if(a==='toggle-rule') toggleRule(t.getAttribute('data-rule'));
      else if(a==='del-rule') deleteRule(t.getAttribute('data-rule'));
    });
  },
  refresh:makeRefresh('/rules','rules'),
  update:function(r){
    var list=r||[];
    setText(this.__count,list.length);
    reconcileCollection(this.__list,list,function(x){return x.rule_id;},'data-rule-key',ruleCardNew,updateRuleCard);
  }
};
function toggleRule(id){
  var card=document.querySelector('[data-rule-key="'+id+'"]');
  var en=card?card.querySelector('[data-field="enabled"]').textContent==='Enabled':false;
  apiFetch('/rules/'+encodeURIComponent(id)+(en?'/disable':'/enable'),{method:'POST'})
    .then(function(){ runViewRefresh(views.rules); })
    .catch(showError);
}
function deleteRule(id){
  if(!window.confirm('Delete rule '+id+'?')) return;
  apiFetch('/rules/'+encodeURIComponent(id),{method:'DELETE'})
    .then(function(){ runViewRefresh(views.rules); })
    .catch(showError);
}

/* ---- Rule editor (overlay, not part of the collection DOM) ---- */
function collectRuleBody(f){
  var body={name:f.name.value};
  if(f.rule_id&&f.rule_id.value) body.rule_id=f.rule_id.value;
  body.trigger={entity:{device_id:f.trg_dev.value,entity_id:f.trg_ent.value},operator:f.trg_op.value,threshold:parseFloat(f.trg_threshold.value)};
  body.actions=[{entity:{device_id:f.act_dev.value,entity_id:f.act_ent.value},action:f.act_type.value,value:parseFloat(f.act_value.value)}];
  if(f.cooldown_ms.value) body.cooldown_ms=parseInt(f.cooldown_ms.value,10);
  if(f.priority.value) body.priority=parseInt(f.priority.value,10);
  if(f.max_act.value) body.max_activations_per_hour=parseInt(f.max_act.value,10);
  body.enabled=true;
  return body;
}
function closeRuleEditor(){
  overlayEl.style.display='none';
  overlayEl.innerHTML='';
  uiState.formActive=false;
  uiState.editingRuleId=null;
  runViewRefresh(views.rules);
}
function openRuleEditor(id){
  uiState.formActive=true;
  uiState.editingRuleId=id;
  overlayEl.style.display='block';
  if(id){
    apiFetch('/rules/'+encodeURIComponent(id)).then(function(rule){
      buildRuleForm(rule);
    }).catch(showError);
  } else {
    buildRuleForm(null);
  }
}
function buildRuleForm(rule){
  var card=el('div',{'class':'card'},[
    el('h2',{'text':rule?'Edit Rule':'Create Rule'}),
    el('form',{'id':'ruleForm'})
  ]);
  var form=card.querySelector('form');
  var trig=(rule&&rule.trigger&&rule.trigger.length)?rule.trigger[0]:null;
  var actions=(rule&&rule.actions&&rule.actions.length)?rule.actions:[];
  var act=actions[0]||null;
  addRow(form,'Name',input('name',rule?rule.name:''),true);
  addRow(form,'Rule ID (optional)',input('rule_id',(rule?rule.rule_id:'')));
  addRow(form,'Trigger - Device ID',input('trg_dev',trig?(trig.entity?trig.entity.device_id:''):'dashboard'));
  addRow(form,'Trigger - Entity ID',input('trg_ent',trig?(trig.entity?trig.entity.entity_id:''):'temperature'));
  addRow(form,'Operator',sel('trg_op',[['GT','>'],['LT','<'],['GE','≥'],['LE','≤'],['EQ','='],['NE','≠']],trig?trig.operator:'GT'));
  addRow(form,'Threshold',input('trg_threshold','number',trig?trig.threshold:30));
  addRow(form,'Action - Device ID',input('act_dev',act?(act.entity?act.entity.device_id:''):'dashboard'));
  addRow(form,'Action - Entity ID',input('act_ent',act?(act.entity?act.entity.entity_id:''):'fan'));
  addRow(form,'Action Type',sel('act_type',[['SET_BOOL','Set Bool'],['SET_LEVEL','Set Level'],['SET_VALUE','Set Value'],['TOGGLE','Toggle']],act?act.action:'SET_BOOL'));
  addRow(form,'Value',input('act_value','number',act?(act.value==null?1:act.value):1));
  addRow(form,'Cooldown (ms)',input('cooldown_ms','number',rule?rule.cooldown_ms:60000));
  addRow(form,'Priority',input('priority','number',rule?rule.priority:10));
  addRow(form,'Max activations / hour',input('max_act','number',rule?rule.max_activations_per_hour:10));
  var save=el('button',{'type':'button','class':'btn btn-primary','style':'margin-top:12px;width:100%'},{'text':'Save'});
  var cancel=el('button',{'type':'button','class':'btn btn-ghost','style':'margin-top:8px;width:100%'},{'text':'Cancel'});
  var btnRow=el('div',{'style':'margin-top:12px'},[save,cancel]);
  form.appendChild(btnRow);
  save.addEventListener('click',function(){ saveRuleForm(); });
  cancel.addEventListener('click',function(){ closeRuleEditor(); });
  overlayEl.innerHTML='';
  overlayEl.appendChild(card);
}
function addRow(form,labelText,inputEl){
  var d=el('div');
  d.appendChild(el('label',{'text':labelText}));
  d.appendChild(inputEl);
  form.appendChild(d);
}
function input(name,value,type){
  var i=el('input',{'name':name,'type':type||'text','value':value==null?'':value});
  return i;
}
function sel(name,opts,selVal){
  var s=el('select',{'name':name});
  opts.forEach(function(o){
    var v=o[0],lab=o[1];
    var opt=el('option',{'value':v,'text':lab});
    if(String(v)===String(selVal)) setAttr(opt,'selected','selected');
    s.appendChild(opt);
  });
  return s;
}
function saveRuleForm(){
  var f=document.getElementById('ruleForm');
  if(!f) return;
  var fels=f.elements;
  var elt=fels.name;
  if(!elt||!elt.value.trim()){ showError(new Error('Name is required')); return; }
  var body=collectRuleBody(fels);
  var id=uiState.editingRuleId;
  var isNew=!id;
  apiFetch(isNew?'/rules':'/rules/'+encodeURIComponent(id),{method:isNew?'POST':'PUT',body:JSON.stringify(body)})
    .then(function(){
      closeRuleEditor();
    }).catch(showError);
}

/* =====================================================================
 * SKILLS view (rarely changes; reconciled incrementally anyway)
 * ===================================================================== */
function skillCardNew(){ return el('div',{'class':'card','data-skill-key':''}); }
function updateSkillCard(sk,node){
  if(!node.__built){
    node.innerHTML=''+
      '<h2></h2>'+
      '<div class="entity"><div class="entity-info">'+
      '<span class="entity-name" data-field="ver"></span>'+
      '<span class="entity-meta" data-field="desc"></span>'+
      '<span class="entity-meta" data-field="schema"></span>'+
      '<span class="entity-meta" data-field="perms"></span></div></div>';
    node.__built=true;
  }
  var h2=node.querySelector('h2');
  h2.textContent='';
  h2.appendChild(el('span',{'text':esc(sk.name)}));
  setText(node.querySelector('[data-field="ver"]'),'v'+sk.version);
  setText(node.querySelector('[data-field="desc"]'),sk.description||'');
  setText(node.querySelector('[data-field="schema"]'),'Schema: '+(sk.schema_id||''));
  var perms='';
  if(sk.permissions&1) perms+='READ ';
  if(sk.permissions&2) perms+='CONTROL ';
  if(sk.permissions&4) perms+='RULE_READ ';
  if(sk.permissions&8) perms+='RULE_WRITE ';
  setText(node.querySelector('[data-field="perms"]'),'Perms: '+perms);
}
views.skills={
  mount:function(host){
    host.innerHTML='<div class="section-header"><h2>Skill Catalog (<span data-field="count">0</span>)</h2></div><div id="skillList" class="grid grid-2"></div>';
    this.__list=host.querySelector('#skillList');
    this.__count=host.querySelector('[data-field="count"]');
  },
  refresh:makeRefresh('/skills','skills'),
  update:function(sk){
    var list=sk||[];
    setText(this.__count,list.length);
    reconcileCollection(this.__list,list,function(x){return x.name;},'data-skill-key',skillCardNew,updateSkillCard);
  }
};

/* =====================================================================
 * LOGS view (append new, remove overflow, keep DOM stable)
 * ===================================================================== */
function logKey(e){
  var ts=(typeof e.ts==='number')?e.ts:(e.timestamp?e.timestamp.seconds:0);
  return ts+':'+(e.source||'')+':'+(e.msg||'');
}
function logCardNew(){ return el('div',{'class':'log-entry','data-log-key':''}); }
function updateLogCard(e,node){
  var lvl=String(e.level||e.layer||'');
  setClass(node,'ERROR',lvl==='ERROR');
  setClass(node,'WARNING',lvl==='WARNING');
  var ts=(typeof e.ts==='number')?e.ts:(e.timestamp?e.timestamp.seconds:0);
  node.textContent='';
  node.appendChild(el('span',{'style':'color:#94a3b8','text':'['+fmtTs(ts)+']'}));
  node.appendChild(el('span',{'style':'font-weight:500','text':(e.source||'')+': '}));
  node.appendChild(el('span',{'text':e.msg||''}));
}
views.logs={
  mount:function(host){
    host.innerHTML='<div class="section-header"><h2>Recent Logs (<span data-field="count">0</span>)</h2></div><div id="logList"></div>';
    this.__list=host.querySelector('#logList');
    this.__count=host.querySelector('[data-field="count"]');
  },
  refresh:makeRefresh('/logs','logs'),
  update:function(l){
    var list=(l||[]).slice(0,50);
    setText(this.__count,list.length);
    reconcileCollection(this.__list,list,logKey,'data-log-key',logCardNew,updateLogCard);
  }
};

/* =====================================================================
 * SYSTEM view
 * ===================================================================== */
views.system={
  mount:function(host){
    host.innerHTML=
      '<div class="section-header"><h2>System Information</h2></div>'+
      '<div class="grid grid-3">'+
      '<div class="card"><h2>Network Mode</h2><div class="metric" data-field="net">—</div></div>'+
      '<div class="card"><h2>SSID</h2><div class="metric" data-field="ssid">—</div></div>'+
      '<div class="card"><h2>IP Address</h2><div class="metric" data-field="ip">—</div></div>'+
      '<div class="card"><h2>Free Heap</h2><div class="metric" data-field="heap">—</div></div>'+
      '<div class="card"><h2>Uptime</h2><div class="metric" data-field="uptime">—</div></div>'+
      '<div class="card"><h2>Build</h2><div class="metric" data-field="build">ESP32 Dashboard</div></div>'+
      '</div>';
    var f={};
    ['net','ssid','ip','heap','uptime','build'].forEach(function(n){
      f[n]=host.querySelector('[data-field="'+n+'"]');
    });
    this.__f=f;
  },
  refresh:makeRefresh('/status','system'),
  update:function(s){
    var f=this.__f;
    setNetLabel(netLabelFor(s));
    setText(f.net,s.network===void 0?'?':String(s.network));
    setText(f.ssid,s.ssid||'—');
    setText(f.ip,s.ip||'—');
    setText(f.heap,s.free_heap+' B');
    setText(f.uptime,Math.floor(s.uptime_ms/1000)+'s');
  }
};

/* =====================================================================
 * NETWORK view (mount-once, explicit scan, never auto-refreshed).
 * pollable:false keeps the Setup form untouched by any polling.
 * ===================================================================== */
var scanCache=[];
views.network={
  pollable:false,
  mount:function(host){
    host.innerHTML=
      '<div class="section-header"><h2>WiFi Network Setup</h2></div>'+
      '<div class="card"><p class="entity-meta">Configure this device to join your local WiFi. After saving it reboots in STA mode (no more AP).</p></div>'+
      '<div class="card"><h2>Scan Networks</h2>'+
        '<button class="btn btn-primary" id="scanBtn">Scan for networks</button>'+
        '<div id="scanList" style="margin-top:12px"></div></div>'+
      '<div class="card"><h2>Connect to WiFi</h2>'+
        '<div class="form-row"><div><label>SSID</label><input id="netSsid" list="scanOpts" placeholder="Network name..."></div>'+
        '<div><label>Password</label><input id="netPassword" type="password" placeholder="Leave empty for open networks"></div></div>'+
        '<datalist id="scanOpts"></datalist>'+
        '<label><input type="checkbox" id="netEnable" checked style="width:auto;margin-right:6px">Enable STA (connect on boot)</label>'+
        '<div style="margin-top:12px"><button class="btn btn-primary" id="connectBtn">Save & Reboot</button> <span id="netMsg" class="empty"></span></div>'+
      '</div>';
    var scanBtn=document.getElementById('scanBtn');
    var connectBtn=document.getElementById('connectBtn');
    var msg=document.getElementById('netMsg');
    var scanList=document.getElementById('scanList');
    var scanOpts=document.getElementById('scanOpts');
    var ssidEl=document.getElementById('netSsid');
    var passEl=document.getElementById('netPassword');
    var enableEl=document.getElementById('netEnable');
    var renderScanList=function(nets){
      if(!nets.length){ scanList.innerHTML='<div class="empty">No networks found. Try scanning again.</div>'; return; }
      scanList.innerHTML='<div class="empty" style="margin-bottom:6px">Click an SSID to select it:</div>'+
        nets.map(function(n){
          return '<button class="btn btn-ghost" style="width:auto;margin:2px 4px" data-ssid="'+esc(n.ssid)+'">'+esc(n.ssid)+' ('+esc(n.rssi)+' dBm)</button>';
        }).join('');
      scanOpts.innerHTML=nets.map(function(n){ return '<option value="'+esc(n.ssid)+'">'; }).join('');
    };
    /* Delegation: scan buttons are recreated per scan, so listen once here. */
    scanList.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('[data-ssid]'):null;
      if(b) setValue(ssidEl,b.getAttribute('data-ssid'));
    });
    scanBtn.addEventListener('click',function(){
      msg.textContent='Scanning...';
      setDisabled(scanBtn,true);
      apiFetch('/wifi/scan').then(function(nets){
        scanCache=nets||[];
        renderScanList(scanCache);
        msg.textContent='Found '+scanCache.length+' network(s).';
        setDisabled(scanBtn,false);
      }).catch(function(){ msg.textContent='Scan failed.'; setDisabled(scanBtn,false); });
    });
    connectBtn.addEventListener('click',function(){
      var ssid=ssidEl.value.trim();
      if(!ssid){ msg.textContent='SSID is required.'; return; }
      var password=passEl.value;
      var enable=enableEl.checked;
      msg.textContent='Saving...';
      setDisabled(connectBtn,true);
      apiFetch('/wifi/connect',{method:'POST',body:JSON.stringify({ssid:ssid,password:password,enabled:enable})})
        .then(function(){ msg.textContent='Saved. Rebooting into STA mode...'; setTimeout(function(){ setOnline(false); },500); })
        .catch(function(){ msg.textContent='Save failed.'; setDisabled(connectBtn,false); });
    });
  }
};

/* =====================================================================
 * Wiring (runs once after all views are defined).
 * ===================================================================== */
navTabs.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('.tab'):null;
  if(!b||!b.getAttribute('data-tab')) return;
  e.preventDefault();
  showView(b.getAttribute('data-tab'));
});
/* Every apiFetch call site has its own .catch, so any unhandled rejection is
 * a bug, not a live connectivity change - do not flip the global indicator. */

showView('dashboard');
setInterval(pollTick,10000);
</script>
