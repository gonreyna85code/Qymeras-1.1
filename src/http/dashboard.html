<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qymeras</title>
<style>
:root{
  --bg:#0f1115; --surface:#161a21; --surface-2:#1d222c; --border:#262c36;
  --text:#e8eaee; --text-dim:#9aa3b2; --text-faint:#6b7280;
  --accent:#5b8cff; --accent-soft:rgba(91,140,255,.14);
  --success:#22c55e; --warning:#f59e0b; --danger:#ef4444; --info:#38bdf8;
  --radius:10px; --shadow:0 6px 24px rgba(0,0,0,.35);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6; --border:#e2e8f0;
  --text:#1a1d21; --text-dim:#475569; --text-faint:#94a3b8;
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
  --success:#16a34a; --warning:#d97706; --danger:#dc2626; --info:#0284c7;
  --shadow:0 6px 20px rgba(15,23,42,.06);
  color-scheme:light;
}
[data-theme="forest"]{
  --bg:#0e1410; --surface:#161d18; --surface-2:#1e281f; --border:#2b3a2e;
  --text:#e6efe7; --text-dim:#9db3a1; --text-faint:#6d8572;
  --accent:#6fc276; --accent-soft:rgba(111,194,118,.14);
  --success:#4ade80; --warning:#fbbf24; --danger:#f87171; --info:#5eead4;
  color-scheme:dark;
}
[data-theme="sand"]{
  --bg:#f3eedf; --surface:#fbf7ec; --surface-2:#efe8d6; --border:#dfd5bb;
  --text:#32291c; --text-dim:#6f6147; --text-faint:#9b8d6f;
  --accent:#b98a3e; --accent-soft:rgba(185,138,62,.14);
  --success:#3f8f4a; --warning:#b7791f; --danger:#b5482f; --info:#356f8f;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- Topbar ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 16px}
.brand{font-size:1.15rem;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand-sub{font-size:.62rem;font-weight:700;background:var(--accent);color:var(--bg);border-radius:999px;padding:2px 7px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--danger);display:inline-block}
.dot.ok{background:var(--success)}
.theme-picker{display:flex;gap:6px;align-items:center}
.theme-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;transition:transform .15s}
.theme-dot.active{transform:scale(1.15);border-color:var(--text)}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.lang-btn{border:none;background:transparent;color:var(--text-dim);font-size:.68rem;font-weight:700;padding:4px 9px;cursor:pointer}
.lang-btn.active{background:var(--accent);color:var(--bg)}
@media(prefers-reduced-motion:no-preference){.theme-dot,.lang-btn{transition:background .15s,color .15s}}
/* ---------- Nav ---------- */
.nav{display:flex;gap:2px;overflow-x:auto;white-space:nowrap;flex:1;min-width:0;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tab{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:none;background:transparent;color:var(--text-dim);font-size:.82rem;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
.tab svg{width:15px;height:15px;flex:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
/* ---------- Layout / cards ---------- */
main{padding:16px;max-width:1200px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:.82rem;font-weight:700;color:var(--text);letter-spacing:.2px;text-transform:uppercase;margin-bottom:12px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.section-header h2{margin-bottom:0}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.metric{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-word}
.entity{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:8px;border:1px solid var(--border)}
.entity-info{display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.entity-name{font-weight:600;font-size:.85rem;word-break:break-word}
.entity-meta{font-size:.7rem;color:var(--text-dim);word-break:break-word}
/* ---------- Buttons / controls ---------- */
.btn{padding:7px 13px;border:none;border-radius:7px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--bg);border-color:transparent}
.btn-primary:disabled{background:var(--accent);opacity:.55}
.btn-danger{background:var(--danger);color:#fff;border-color:transparent}
.btn-ghost{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}
@media(prefers-reduced-motion:no-preference){.btn{transition:filter .15s,transform .05s}.btn:hover:not(:disabled){filter:brightness(1.1)}.btn:active:not(:disabled){transform:translateY(1px)}}
.toggle{position:relative;width:44px;height:24px;background:var(--text-faint);border:none;border-radius:999px;cursor:pointer;flex:none}
.toggle.on{background:var(--success)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%}
.toggle.on::after{left:22px}
@media(prefers-reduced-motion:no-preference){.toggle{transition:background .15s}.toggle::after{transition:left .15s}}
.slider{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:3px;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;background:var(--accent);border-radius:50%;cursor:pointer}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:.82rem;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.7rem;font-weight:600;color:var(--text-dim);margin:8px 0 4px}
.form-row{display:flex;gap:12px}
.form-row>div{flex:1}
/* ---------- Status styling ---------- */
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.65rem;font-weight:700;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}
.badge-online,.badge-enabled{background:var(--accent-soft);color:var(--success);border-color:transparent}
.badge-offline,.badge-disabled,.badge-error{background:rgba(239,68,68,.12);color:var(--danger);border-color:transparent}
.badge-pending{background:rgba(245,158,11,.14);color:var(--warning);border-color:transparent}
.badge-confirmed{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge-local{background:var(--accent-soft);color:var(--info);border-color:transparent}
.badge-remote{background:rgba(168,85,247,.14);color:#c084fc;border-color:transparent}
[data-theme="light"] .badge-remote,[data-theme="sand"] .badge-remote{color:#7c3aed}
.empty{color:var(--text-faint);font-size:.82rem;padding:8px 0}
/* ---------- Logs ---------- */
.log-entry{font-family:var(--mono);font-size:.7rem;padding:6px 10px;background:var(--surface-2);border-radius:6px;margin-bottom:4px;border-left:3px solid var(--accent);word-break:break-word;display:flex;gap:6px;flex-wrap:wrap;border:1px solid var(--border)}
.log-entry.ERROR{border-left-color:var(--danger)}
.log-entry.WARNING{border-left-color:var(--warning)}
/* ---------- Toast / overlay ---------- */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:10px 14px;border-radius:8px;font-size:.8rem;z-index:99;max-width:90vw;display:none;box-shadow:var(--shadow)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;overflow-y:auto;padding:24px}
#overlay .card{max-width:720px;margin:0 auto}
/* ---------- Responsive ---------- */
@media(max-width:720px){
  .topbar{gap:8px;padding:8px 10px}
  .brand{font-size:1rem}
  main{padding:12px}
  .form-row{flex-direction:column;gap:0}
  .nav{order:99;flex-basis:100%}
  .nav::-webkit-scrollbar{display:none}
  .topbar-right{margin-left:auto}
  .chip{display:none}
}
</style>

function tf(key,map){ var s=t(key),k; for(k in map){ s=s.split('{'+k+'}').join(map[k]); } return s; }
function applyI18n(root){
  if(!root) return;
  var i,ns=root.querySelectorAll('[data-i18n]');
  for(i=0;i<ns.length;i++) if(ns[i].getAttribute('data-i18n')) ns[i].textContent=t(ns[i].getAttribute('data-i18n'));

}
function applyLang(l){
  lang=(l==='en')?'en':'es';

  Array.prototype.forEach.call(bs,function(b){ b.classList.toggle('active',b.getAttribute('data-lang')===lang); });
}
function setLang(l){

/* =====================================================================
 * Theme (CSS tokens on <html data-theme>). Persisted, defaults to dark.
 * ===================================================================== */
var THEMES=[['dark','#3a3a3a'],['light','#f7f2ff'],['forest','#4c834e'],['sand','#c1af8d']];
function setTheme(name){
  document.documentElement.setAttribute('data-theme',name||'dark');
  try{ localStorage.setItem('qymera_theme',name||'dark'); }catch(e){}
  Array.prototype.forEach.call(themePickerEl.children,function(b){
    b.classList.toggle('active',document.documentElement.getAttribute('data-theme')===b.getAttribute('data-theme'));
  });
}
function buildThemePicker(){
  themePickerEl.innerHTML='';
  THEMES.forEach(function(th){
    themePickerEl.appendChild(el('button',{'type':'button','class':'theme-dot','data-theme':th[0],'title':th[0],'style':'background:'+th[1]}));
  });
  themePickerEl.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.theme-dot'):null;
    if(b) setTheme(b.getAttribute('data-theme'));
  });
}

/* =====================================================================
 * UI state is kept apart from the DOM. DOM attributes are only used for
 * bindings (data-field / data-action / data-*key), never for source data.
 * ===================================================================== */
var uiState={
  activeView:'dashboard',
  formActive:false,
  editingRuleId:null,
  pending:new Set()
};

/* =====================================================================
 * Tiny DOM update helpers - each skips the DOM write when unchanged.
 * ===================================================================== */
function setText(node,value){
  if(!node) return;
  var next=String(value==null?'':value);
  if(node.textContent!==next) node.textContent=next;
}
function setClass(node,cls,on){
  if(!node) return;
  if(on) node.classList.add(cls); else node.classList.remove(cls);
}
function setDisabled(node,d){
  if(!node) return;
  if(node.disabled!==!!d) node.disabled=!!d;
}
function setAttr(node,name,value){
  if(!node) return;
  var next=String(value==null?'':value);
  if(node.getAttribute(name)!==next) node.setAttribute(name,next);
}
function setValue(node,value){
  if(!node) return;
  var next=String(value==null?'':value);
  if(node.value!==next) node.value=next;
}

/* DOM builder: minimal, no framework. */
function el(tag,attrs,children){
  var n=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(!Object.prototype.hasOwnProperty.call(attrs,k)) continue;
    if(k==='class') n.className=attrs[k];
    else if(k==='text') n.textContent=attrs[k];
    else n.setAttribute(k,attrs[k]);
  }
  if(children){
    (Array.isArray(children)?children:[children]).forEach(function(c){
      if(c==null) return;
      n.appendChild(typeof c==='string'?document.createTextNode(c):c);
    });
  }
  return n;
}
function insertAt(container,node,idx){
  var kids=container.children;
  if(idx>=kids.length) container.appendChild(node);
  else container.insertBefore(node,kids[idx]);
}

/* reconcileCollection(container, list, keyFn, attr, create, apply)
 * In-place diff: existing key -> apply() in place; new key -> create one
 * node; missing key -> remove one node. Order is preserved. Never wipes or
 * rebuilds the container, so focus/unpersisted DOM state survives refresh.
 * `attr` is the stable-key attribute (data-*-key) on each child node. */
function reconcileCollection(container,list,keyFn,attr,create,apply){
  var byKey={};
  list.forEach(function(it){ byKey[keyFn(it)]=it; });
  Array.prototype.slice.call(container.children).forEach(function(node){
    var k=node.getAttribute(attr);
    if(k==null||!byKey[k]) container.removeChild(node);
  });
  var kids=container.children;
  list.forEach(function(it,idx){
    var k=keyFn(it);
    var node=null;
    Array.prototype.some.call(kids,function(n){ if(n.getAttribute(attr)===k){node=n;return true;} return false; });
    if(!node){
      node=create(it);
      node.setAttribute(attr,k);
      apply(it,node);
      insertAt(container,node,idx);
    } else {
      apply(it,node);
      if(kids[idx]!==node) container.insertBefore(node,kids[idx]||null);
    }
  });
}

/* =====================================================================
 * API + online status
 * ===================================================================== */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtBool(v){ return v===true?t('common.on'):(v===false?t('common.off'):esc(v)); }
function fmtTs(sec){ if(!sec) return '—'; return new Date(sec*1000).toLocaleTimeString(lang); }
function badgeForStatus(s){
  if(!s) return '';
  var st=String(s);
  if(st==='STATE_CONFIRMED'||st==='CONFIRMED') return 'badge-confirmed';
  if(st==='FAILED'||st==='TIMEOUT') return 'badge-error';
  return 'badge-pending';
}
function apiFetch(path,opts){
  opts=opts||{};
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},8000);
  var init={headers:{'Content-Type':'application/json'},signal:ctrl.signal};
  if(opts.method){ init.method=opts.method; }
  if(opts.body){ init.body=opts.body; }
  return fetch(API+path,init).then(function(r){
      clearTimeout(timer);
      return r.text().then(function(txt){
        var j=null;
        try{ j=JSON.parse(txt); }catch(e){ j=null; }
        if(!j){ throw new Error('Invalid JSON response from '+path); }
        if(!j.ok){ throw new Error((j.error&&j.error.code?j.error.code+': ':'')+(j.error&&j.error.message?j.error.message:'request failed')); }
        return j.data;
      });
    }).catch(function(e){
      clearTimeout(timer);
      if(e&&e.name==='AbortError') throw new Error('Timeout: '+path+' unreachable');
      throw e;
    });
}
function setOnline(b){
  statusDot.className=b?'dot ok':'dot';
  setText(statusTextEl,t(b?'common.online':'common.offline'));
}
function setNetLabel(txt){ setText(sysInfoEl,txt); }
/* Human label for the connection the device is currently hosting. */
function netLabelFor(s){
  if(!s||!s.network) return '';
  return s.network==='AP'||s.network==='APSTA'?('AP · '+(s.ssid||'')):'STA';
}
var toastTimer;
function showError(err){
  toastEl.textContent=(t('common.error')+': ')+(err&&err.message?err.message:'unknown');
  toastEl.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ toastEl.style.display='none'; },4000);
}

/* =====================================================================
 * Polling engine: active view only + request dedup + stale protection.
 * Each view keeps: gen (stale-response check), inflight (dedup), mount/refresh/update.
 * ===================================================================== */
var views={};
function makeRefresh(path,viewName){
  return function(gen){
    return apiFetch(path).then(function(data){
      if(gen===views[viewName].gen){
        setOnline(true);
        views[viewName].update(data);
      }
    });
  };
}
function runViewRefresh(v){
  if(!v||!v.refresh||v.inflight) return;
  if(v.pollable===false) return;
  if(uiState.formActive) return;
  if(typeof v.gen!=='number') v.gen=0;
  v.inflight=true;
  var gen=++v.gen;
  v.refresh(gen).then(function(){ v.inflight=false; })
    .catch(function(){ v.inflight=false; setOnline(false); });
}
function showView(name){
  uiState.activeView=name;
  var v=views[name];
  Array.prototype.forEach.call(navTabs.querySelectorAll('.tab'),function(b){
    setClass(b,'active',b.getAttribute('data-tab')===name);
  });
  var host=document.getElementById('view-'+name);
  if(!host){
    host=document.createElement('div');
    host.id='view-'+name;
    main.appendChild(host);
    v.host=host;
    if(v.mount) v.mount(host);
  }
  Object.keys(views).forEach(function(n){
    var h=document.getElementById('view-'+n);
    if(h) h.style.display=(n===name)?'':'none';
  });
  if(v.refresh&&v.pollable!==false) runViewRefresh(v);
}
/* Single consistent poll interval; only the active view is fetched, and a
 * view that is a form (uiState.formActive) is skipped so typing survives. */
function pollTick(){
  var v=views[uiState.activeView];
  if(v&&v.refresh&&v.pollable!==false&&!uiState.formActive) runViewRefresh(v);
}

function updateEntityControl(ent,node){
  var key=ent.device_id+'/'+ent.entity_id;
  var caps=ent.capabilities||[];
  var isRelay=caps.indexOf('actuator.relay')>=0;
  var isDimmer=caps.indexOf('actuator.dimmer')>=0;
  var type=isRelay?'relay':(isDimmer?'dimmer':'none');
  var holder=node.querySelector('[data-control]');
  var busy=uiState.pending.has(key);
  if(node.__ctlType!==type){
    holder.innerHTML='';
    if(type==='relay'){
      node.__ctl=el('button',{'class':'toggle','data-action':'toggle','data-k':key,'aria-label':t('nav.rules')});
      holder.appendChild(node.__ctl);
    } else if(type==='dimmer'){
      node.__ctl=el('input',{'type':'range','class':'slider','min':'0','max':'100','data-action':'dimmer','data-k':key});
      holder.appendChild(node.__ctl);
    } else {
      node.__ctl=null;
      holder.appendChild(document.createTextNode(fmtBool(ent.desired)));
    }
    node.__ctlType=type;
  }
  var ctl=node.__ctl;
  if(type==='relay'){
    setClass(ctl,'on',ent.desired===true);
    setAttr(ctl,'data-want',ent.desired===true?'1':'0');
    setDisabled(ctl,busy);
  } else if(type==='dimmer'){
    setDisabled(ctl,busy);
    var lv=(typeof ent.desired==='number')?ent.desired:(ent.current||0);
    /* Suppress echo while the user is dragging so the thumb does not jump. */
    if(ctl!==document.activeElement) setValue(ctl,lv);
  }
}
function handleToggle(t){
  if(t.disabled) return;
  var key=t.getAttribute('data-k');
  var kv=key.split('/');
  var want=(t.getAttribute('data-want')==='1');
  t.disabled=true; uiState.pending.add(key);
  apiFetch('/control/relay',{method:'POST',body:JSON.stringify({device_id:kv[0],entity_id:kv[1],value:!want})})
    .then(function(){ uiState.pending.delete(key); runViewRefresh(views.entities); })
    .catch(function(e){ uiState.pending.delete(key); showError(e); });
}
function handleDimmer(s){
  if(s.disabled) return;
  var key=s.getAttribute('data-k');
  var kv=key.split('/');
  s.disabled=true; uiState.pending.add(key);
  apiFetch('/control/dimmer',{method:'POST',body:JSON.stringify({device_id:kv[0],entity_id:kv[1],level:parseInt(s.value,10)})})
    .then(function(){ uiState.pending.delete(key); runViewRefresh(views.entities); })
    .catch(function(e){ uiState.pending.delete(key); showError(e); });
}

  body.trigger={entity:{device_id:f.trg_dev.value,entity_id:f.trg_ent.value},operator:f.trg_op.value,threshold:parseFloat(f.trg_threshold.value)};
  body.actions=[{entity:{device_id:f.act_dev.value,entity_id:f.act_ent.value},action:f.act_type.value,value:parseFloat(f.act_value.value)}];

  if(f.priority.value) body.priority=parseInt(f.priority.value,10);
  if(f.max_act.value) body.max_activations_per_hour=parseInt(f.max_act.value,10);

  var form=card.querySelector('form');
  var trig=(rule&&rule.trigger&&rule.trigger.length)?rule.trigger[0]:null;
  var actions=(rule&&rule.actions&&rule.actions.length)?rule.actions:[];
  var act=actions[0]||null;
  addRow(form,t('rules.form.name'),input('name',rule?rule.name:''),true);
  addRow(form,t('rules.form.rule_id'),input('rule_id',(rule?rule.rule_id:'')));
  addRow(form,t('rules.form.trg_dev'),input('trg_dev',trig?(trig.entity?trig.entity.device_id:''):'dashboard'));
  addRow(form,t('rules.form.trg_ent'),input('trg_ent',trig?(trig.entity?trig.entity.entity_id:''):'temperature'));
  addRow(form,t('rules.form.operator'),sel('trg_op',[['GT','>'],['LT','<'],['GE','≥'],['LE','≤'],['EQ','='],['NE','≠']],trig?trig.operator:'GT'));
  addRow(form,t('rules.form.threshold'),input('trg_threshold','number',trig?trig.threshold:30));
  addRow(form,t('rules.form.act_dev'),input('act_dev',act?(act.entity?act.entity.device_id:''):'dashboard'));
  addRow(form,t('rules.form.act_ent'),input('act_ent',act?(act.entity?act.entity.entity_id:''):'fan'));
  addRow(form,t('rules.form.act_type'),sel('act_type',[['SET_BOOL',t('rules.act.SET_BOOL')],['SET_LEVEL',t('rules.act.SET_LEVEL')],['SET_VALUE',t('rules.act.SET_VALUE')],['TOGGLE',t('rules.act.TOGGLE')]],act?act.action:'SET_BOOL'));
  addRow(form,t('rules.form.value'),input('act_value','number',act?(act.value==null?1:act.value):1));
  addRow(form,t('rules.form.cooldown'),input('cooldown_ms','number',rule?rule.cooldown_ms:60000));
  addRow(form,t('rules.form.priority'),input('priority','number',rule?rule.priority:10));
  addRow(form,t('rules.form.max_act'),input('max_act','number',rule?rule.max_activations_per_hour:10));
  var save=el('button',{'type':'button','class':'btn btn-primary','style':'margin-top:12px;width:100%'},{'text':t('common.save')});
  var cancel=el('button',{'type':'button','class':'btn btn-ghost','style':'margin-top:8px;width:100%'},{'text':t('common.cancel')});
  var btnRow=el('div',{'style':'margin-top:12px'},[save,cancel]);
  form.appendChild(btnRow);
  save.addEventListener('click',function(){ saveRuleForm(); });
  cancel.addEventListener('click',function(){ closeRuleEditor(); });
  overlayEl.innerHTML='';
  overlayEl.appendChild(card);
}
function addRow(form,labelText,inputEl){
  var d=el('div');
  d.appendChild(el('label',{'text':labelText}));
  d.appendChild(inputEl);
  form.appendChild(d);
}
function input(name,value,type){
  var i=el('input',{'name':name,'type':type||'text','value':value==null?'':value});
  return i;
}
function sel(name,opts,selVal){
  var s=el('select',{'name':name});
  opts.forEach(function(o){
    var v=o[0],lab=o[1];
    var opt=el('option',{'value':v,'text':lab});
    if(String(v)===String(selVal)) setAttr(opt,'selected','selected');
    s.appendChild(opt);
  });
  return s;
}
function saveRuleForm(){
  var f=document.getElementById('ruleForm');
  if(!f) return;
  var fels=f.elements;
  var elt=fels.name;
  if(!elt||!elt.value.trim()){ showError(new Error(t('rules.name_req'))); return; }
  var body=collectRuleBody(fels);
  var id=uiState.editingRuleId;
  var isNew=!id;
  apiFetch(isNew?'/rules':'/rules/'+encodeURIComponent(id),{method:isNew?'POST':'PUT',body:JSON.stringify(body)})
    .then(function(){
      closeRuleEditor();
    }).catch(showError);
}

/* =====================================================================
 * SKILLS view (rarely changes; reconciled incrementally anyway)
 * ===================================================================== */
function skillCardNew(){ return el('div',{'class':'card','data-skill-key':''}); }
function updateSkillCard(sk,node){
  if(!node.__built){
    node.innerHTML=''+
      '<h2></h2>'+
      '<div class="entity"><div class="entity-info">'+
      '<span class="entity-name" data-field="ver"></span>'+
      '<span class="entity-meta" data-field="desc"></span>'+
      '<span class="entity-meta" data-field="schema"></span>'+
      '<span class="entity-meta" data-field="perms"></span></div></div>';
    node.__built=true;
  }
  var h2=node.querySelector('h2');
  h2.textContent='';
  h2.appendChild(el('span',{'text':esc(sk.name)}));
  setText(node.querySelector('[data-field="ver"]'),'v'+sk.version);
  setText(node.querySelector('[data-field="desc"]'),sk.description||'');
  setText(node.querySelector('[data-field="schema"]'),t('common.schema')+': '+(sk.schema_id||''));
  var perms='';
  if(sk.permissions&1) perms+='READ ';
  if(sk.permissions&2) perms+='CONTROL ';
  if(sk.permissions&4) perms+='RULE_READ ';
  if(sk.permissions&8) perms+='RULE_WRITE ';
  setText(node.querySelector('[data-field="perms"]'),t('common.perms')+': '+perms);
}
views.skills={
  mount:function(host){
    host.innerHTML='<div class="section-header"><h2 data-i18n="skills.title">Skills</h2><span class="empty"></span></div><div id="skillList" class="grid grid-2"></div>';
    applyI18n(host);
    this.__list=host.querySelector('#skillList');
    this.__count=host.querySelector('.section-header .empty');
  },
  refresh:makeRefresh('/skills','skills'),
  update:function(sk){
    var list=sk||[];
    setText(this.__count,list.length+'');
    reconcileCollection(this.__list,list,function(x){return x.name;},'data-skill-key',skillCardNew,updateSkillCard);
  }
};

/* =====================================================================
 * LOGS view (append new, remove overflow, keep DOM stable)
 * ===================================================================== */
function logKey(e){
  var ts=(typeof e.ts==='number')?e.ts:(e.timestamp?e.timestamp.seconds:0);
  return ts+':'+(e.source||'')+':'+(e.msg||'');
}
function logCardNew(){ return el('div',{'class':'log-entry','data-log-key':''}); }
function updateLogCard(e,node){
  var lvl=String(e.level||e.layer||'');
  setClass(node,'ERROR',lvl==='ERROR');
  setClass(node,'WARNING',lvl==='WARNING');
  var ts=(typeof e.ts==='number')?e.ts:(e.timestamp?e.timestamp.seconds:0);
  node.textContent='';
  node.appendChild(el('span',{'style':'color:var(--text-faint)','text':'['+fmtTs(ts)+']'}));
  node.appendChild(el('span',{'style':'font-weight:500','text':(e.source||'')+': '}));
  node.appendChild(el('span',{'text':e.msg||''}));
}
views.logs={
  mount:function(host){
    host.innerHTML='<div class="section-header"><h2 data-i18n="logs.title">Logs</h2><span class="empty"></span></div><div id="logList"></div>';
    applyI18n(host);
    this.__list=host.querySelector('#logList');
    this.__count=host.querySelector('.section-header .empty');
  },
  refresh:makeRefresh('/logs','logs'),
  update:function(l){
    var list=(l||[]).slice(0,50);
    setText(this.__count,list.length+'');
    reconcileCollection(this.__list,list,logKey,'data-log-key',logCardNew,updateLogCard);
  }
};

/* =====================================================================
 * SYSTEM view
 * ===================================================================== */
views.system={
  mount:function(host){
    host.innerHTML=
      '<div class="grid grid-3">'+
      '<div class="card"><h2 data-i18n="system.net">Network</h2><div class="metric" data-field="net">—</div></div>'+
      '<div class="card"><h2 data-i18n="system.ssid">SSID</h2><div class="metric" data-field="ssid">—</div></div>'+
      '<div class="card"><h2 data-i18n="system.ip">IP</h2><div class="metric" data-field="ip">—</div></div>'+
      '<div class="card"><h2 data-i18n="system.heap">Heap</h2><div class="metric" data-field="heap">—</div></div>'+
      '<div class="card"><h2 data-i18n="system.uptime">Uptime</h2><div class="metric" data-field="uptime">—</div></div>'+
      '<div class="card"><h2 data-i18n="system.build">Build</h2><div class="metric" data-field="build">ESP32 Dashboard</div></div>'+
      '</div>';
    applyI18n(host);
    var f={};
    ['net','ssid','ip','heap','uptime','build'].forEach(function(n){
      f[n]=host.querySelector('[data-field="'+n+'"]');
    });
    this.__f=f;
  },
  refresh:makeRefresh('/status','system'),
  update:function(s){
    var f=this.__f;
    setNetLabel(netLabelFor(s));
    setText(f.net,s.network===void 0?'?':String(s.network));
    setText(f.ssid,s.ssid||'—');
    setText(f.ip,s.ip||'—');
    setText(f.heap,s.free_heap+' B');
    setText(f.uptime,Math.floor(s.uptime_ms/1000)+'s');
  }
};

/* =====================================================================
 * NETWORK view (mount-once, explicit scan, never auto-refreshed).
 * pollable:false keeps the Setup form untouched by any polling.
 * ===================================================================== */
var scanCache=[];
views.network={
  pollable:false,
  mount:function(host){
    host.innerHTML=
      '<div class="card"><p class="entity-meta" data-i18n="network.hint">Configure this device to join your local WiFi. After saving it reboots in STA mode (no more AP).</p></div>'+
      '<div class="card"><h2 data-i18n="network.scan">Scan Networks</h2>'+
        '<button class="btn btn-primary" id="scanBtn" data-i18n="network.scan_btn">Scan for networks</button>'+
        '<div id="scanList" style="margin-top:12px"></div></div>'+
      '<div class="card"><h2 data-i18n="network.connect">Connect to WiFi</h2>'+
        '<div class="form-row"><div><label data-i18n="network.ssid">SSID</label><input id="netSsid" list="scanOpts" data-i18n-ph="network.ssid_ph" placeholder="Network name..."></div>'+
        '<div><label data-i18n="network.password">Password</label><input id="netPassword" type="password" data-i18n-ph="network.password_ph" placeholder="Leave empty for open networks"></div></div>'+
        '<div class="form-row"><div><label data-i18n="network.udp_disc">UDP Discovery Port</label><input id="netUdpDiscovery" type="number" value="13345" min="1" placeholder="13345"></div>'+
        '<div><label data-i18n="network.udp_ctrl">UDP Control Port</label><input id="netUdpControl" type="number" value="13346" min="1" placeholder="13346"></div></div>'+
        '<datalist id="scanOpts"></datalist>'+
        '<label><input type="checkbox" id="netEnable" checked style="width:auto;margin-right:6px"><span data-i18n="network.sta_enable">Enable STA (connect on boot)</span></label>'+
        '<div style="margin-top:12px"><button class="btn btn-primary" id="connectBtn" data-i18n="network.save_reboot">Save & Reboot</button> <span id="netMsg" class="empty"></span></div>'+
      '</div>';
    applyI18n(host);
    var scanBtn=document.getElementById('scanBtn');
    var connectBtn=document.getElementById('connectBtn');
    var msg=document.getElementById('netMsg');
    var scanList=document.getElementById('scanList');
    var scanOpts=document.getElementById('scanOpts');
    var ssidEl=document.getElementById('netSsid');
    var passEl=document.getElementById('netPassword');
    var enableEl=document.getElementById('netEnable');
    var renderScanList=function(nets){
      if(!nets.length){ scanList.innerHTML='<div class="empty" data-i18n="network.no_nets">No networks found. Try scanning again.</div>'; applyI18n(scanList); return; }
      scanList.innerHTML='<div class="empty" style="margin-bottom:6px" data-i18n="network.click_ssid">Click an SSID to select it:</div>'+
        nets.map(function(n){
          return '<button class="btn btn-ghost" style="width:auto;margin:2px 4px" data-ssid="'+esc(n.ssid)+'">'+esc(n.ssid)+' ('+esc(n.rssi)+' dBm)</button>';
        }).join('');
      applyI18n(scanList);
      scanOpts.innerHTML=nets.map(function(n){ return '<option value="'+esc(n.ssid)+'">'; }).join('');
    };
    /* Delegation: scan buttons are recreated per scan, so listen once here. */
    scanList.addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('[data-ssid]'):null;
      if(b) setValue(ssidEl,b.getAttribute('data-ssid'));
    });
    scanBtn.addEventListener('click',function(){
      msg.textContent=t('network.scanning');
      setDisabled(scanBtn,true);
      apiFetch('/wifi/scan').then(function(nets){
        scanCache=nets||[];
        renderScanList(scanCache);
        msg.textContent=tf('network.found',{0:scanCache.length});
        setDisabled(scanBtn,false);
      }).catch(function(){ msg.textContent=t('network.scan_failed'); setDisabled(scanBtn,false); });
    });
    connectBtn.addEventListener('click',function(){
      var ssid=ssidEl.value.trim();
      if(!ssid){ msg.textContent=t('network.ssid_req'); return; }
      var password=passEl.value;
      var enable=enableEl.checked;
      var udpDiscovery=document.getElementById('netUdpDiscovery').value||'13345';
      var udpControl=document.getElementById('netUdpControl').value||'13346';
      msg.textContent=t('common.saving');
      setDisabled(connectBtn,true);
      apiFetch('/wifi/connect',{method:'POST',body:JSON.stringify({ssid:ssid,password:password,enabled:enable,udp_discovery_port:Number(udpDiscovery),udp_control_port:Number(udpControl)})})
        .then(function(){ msg.textContent=t('network.saved'); setTimeout(function(){ setOnline(false); },500); })
        .catch(function(){ msg.textContent=t('network.save_failed'); setDisabled(connectBtn,false); });
    });
  }
};

/* =====================================================================
 * Wiring (runs once after all views are defined).
 * ===================================================================== */
navTabs.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('.tab'):null;
  if(!b||!b.getAttribute('data-tab')) return;
  e.preventDefault();
  showView(b.getAttribute('data-tab'));
});
/* Every apiFetch call site has its own .catch, so any unhandled rejection is
 * a bug, not a live connectivity change - do not flip the global indicator. */

buildThemePicker();
buildNav();
loadPrefs();
setOnline(false);
setInterval(pollTick,10000);
showView('dashboard');

function loadPrefs(){
  var t0='dark',l='es';
  try{ t0=localStorage.getItem('qymera_theme')||'dark'; l=localStorage.getItem('qymera_lang')||'es'; }catch(e){}
  if(l!=='es'&&l!=='en') l='es';
  applyLang(l);
  applyI18n(document.body);
  setTheme(t0);
}
</script>
