# Qymera v1 Integration Contract (Dashboard -> Node)
#
# STATUS: WORKING DRAFT (Dashboard side).
# The authoritative copy of this contract lives in the Qymera (firmware) repo
# and is published once the Node v1 API lands. This file is the Dashboard's
# machine-readable working specification: the qymera_node_client,
# tests/integration/mock_node.py and tests/integration/test_contract.py all
# implement and validate exactly this surface. When the authoritative
# firmware spec differs, reconcile in the client module (single boundary).
#
# PRINCIPLES
#   - Dashboard NEVER speaks to Nodes through raw transports (UDP/ESP-NOW).
#     All Node communication is this HTTP application API.
#   - Device/entity identity is stable (device_id / entity_id strings), never
#     IP address and never array index.
#   - HTTP 200 does NOT mean an actuator reached its state. Command results
#     carry status + resulting state; the Dashboard confirms by authoritative
#     state snapshot.
#   - The Node is authoritative for device/entity state. Dashboard never
#     invents a remote state.
openapi: 3.0.3
info:
  title: Qymera Node v1 API
  version: "1.0"
  description: Application API served by a Qymera Node (firmware).

x-version-negotiation:
  api_version: "1.0"        # Dashboard<->Node API surface version
  protocol_version: "1.0"   # Node-to-Node transport version (never used by Dashboard)
  rules:
    - Dashboard accepts a Node if Node api_version has the same major
      version as the Dashboard's, unless rejected by capability checks.
    - api_version mismatch (major) -> UNSUPPORTED_API_VERSION; the Node is
      surfaced as incompatible, not a black hole.

servers:
  - url: http://{node}/api/v1
    variables:
      node:
        default: "192.168.1.5"
        description: Host and port of a Node (discovered via Dashboard node config).

# ------------------------------------------------------------------
# Envelope (all endpoints)
# ------------------------------------------------------------------
components:
  schemas:
    OkEnvelope:
      type: object
      required: [ok]
      properties:
        ok: { const: true }
        data: { nullable: true }
    ErrorEnvelope:
      type: object
      required: [ok, error]
      properties:
        ok: { const: false }
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - ENTITY_NOT_FOUND
                - DEVICE_NOT_FOUND
                - COMMAND_NOT_SUPPORTED
                - INVALID_VALUE
                - NOT_AUTHORIZED
                - DEVICE_OFFLINE
                - TIMEOUT
                - RATE_LIMITED
                - INTERNAL_ERROR
                - UNSUPPORTED_API_VERSION
            message: { type: string }
            details: { type: object, nullable: true }
    Error: { $ref: "#/components/schemas/ErrorEnvelope" }
    Device:
      type: object
      required: [device_id, name, model, firmware_version, api_version, protocol_version, ip, online, capabilities]
      properties:
        device_id: { type: string }
        name: { type: string }
        model: { type: string }
        firmware_version: { type: string }
        api_version: { type: string }
        protocol_version: { type: string }
        ip: { type: string }
        uptime_ms: { type: integer }
        free_heap: { type: integer }
        online: { type: boolean }
        capabilities:
          type: array
          items: { type: string }
          enum:
            - entities
            - commands
            - automations
            - ota
    Entity:
      type: object
      required: [entity_id, device_id, name, type, capabilities, state, config]
      properties:
        entity_id: { type: string }           # stable, immutable
        device_id: { type: string }           # stable, immutable
        name: { type: string }
        type:
          type: string
          enum:
            - sensor.temperature
            - sensor.humidity
            - sensor.luminosity
            - sensor.pressure
            - sensor.level
            - sensor.airq
            - sensor.rain
            - sensor.contact
            - sensor.generic
            - actuator.relay
            - actuator.dimmer
            - virtual.digital
            - virtual.analog
            - inference.result
            - time
        capabilities:
          type: array
          items: { type: string }
          enum:
            - sensor.numeric
            - sensor.digital
            - actuator.relay
            - actuator.dimmer
            - actuator.generic
            - inference.result
            - time.source
        unit: { type: string, nullable: true }
        state:
          type: object
          required: [value, available]
          properties:
            value: { type: [number, boolean], example: 23.5 }
            available: { type: boolean }
            reliability:
              type: string
              enum: [live, stale, offline]
            timestamp: { type: integer }
        config:
          type: object
          properties:
            native_min: { type: number }
            native_max: { type: number }
            unit: { type: string }

# ------------------------------------------------------------------
# Endpoints
# ------------------------------------------------------------------
paths:
  /status:
    get:
      summary: Node identity + runtime + version negotiation data
      operationId: getStatus
      responses:
        "200":
          description: Node identity and version/capability info
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  data: { $ref: "#/components/schemas/Device" }
  /entities:
    get:
      summary: Full authoritative entity snapshot (initial + reconciliation)
      operationId: listEntities
      responses:
        "200":
          description: Entity snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Entity" }
  /entities/{entity_id}/command:
    post:
      summary: Execute one command on an entity
      operationId: sendCommand
      parameters:
        - { name: entity_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [set_relay, set_dimmer]
                value:
                  oneOf:
                    - { type: boolean, description: "set_relay: true/false" }
                    - { type: number, minimum: 0, maximum: 100, description: "set_dimmer: 0..100" }
                device_id:
                  type: string
                  description: Optional; the Node validates it matches the entity owner.
      responses:
        "200":
          description: |-
            Command accepted or rejected. HTTP 200 means the request was
            understood and answered; use status/error to learn the outcome.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, status, target]
                properties:
                  accepted: { type: boolean }
                  status:
                    type: string
                    enum: [done, error]   # executing retained for very slow effects; never required
                  target:
                    type: object
                    properties:
                      device_id: { type: string }
                      entity_id: { type: string }
                  result:
                    type: object
                    description: Resulting authoritative state after command (best effort)
                    properties:
                      value: { type: [number, boolean] }
                  error: { $ref: "#/components/schemas/Error" }
        "400":
          description: Malformed body / invalid value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Unknown entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

# ------------------------------------------------------------------
# Command semantics
# ------------------------------------------------------------------
x-command-semantics:
  - "accepted:false + error.code -> terminal failure (COMMAND_NOT_SUPPORTED, INVALID_VALUE, ENTITY_NOT_FOUND, DEVICE_OFFLINE, NOT_AUTHORIZED, RATE_LIMITED, INTERNAL_ERROR)."
  - "accepted:true + status:done -> the Node applied the command; Dashboard still confirms via snapshot state (authoritative)."
  - "accepted:true + status:error -> applied-but-failed; terminal failure; Dashboard keeps desired only if a later snapshot matches."
  - "Network failure / timeout -> Dashboard marks the Node unreachable and the command TIMEOUT; the snapshot on recovery reconciles real state."

# ------------------------------------------------------------------
# State synchronization (Dashboard side of the contract)
# ------------------------------------------------------------------
x-state-sync:
  initial_snapshot: "On Node first contact: GET /status then GET /entities; seed registry."
  reconciliation: "Periodic GET /entities (interval per node); authoritative values overwrite observed."
  command_result: "Command responses set cmd_status + desired; only snapshot matches clear desired to confirmed."
  recovery: "Reboot/IP change/timeout recovered by re-polling configured node targets; never trust IP as identity."
  availability: "Entity available = reported on the last snapshot; node online = last HTTP round-trip within timeout."