; Qymera Dashboard - ESP32 only, no Arduino framework
; Uses ESP-IDF components directly via PlatformIO espressif32 platform (Arduino framework for ESP-IDF headers)

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -Wl,-Map,firmware.map
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -fno-rtti
    -fno-exceptions
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Isrc
    -Isrc/core
    -Isrc/hal
    -Isrc/devices
    -Isrc/events
    -Isrc/automation
    -Isrc/control
    -Isrc/storage
    -Isrc/network/udp
    -Isrc/ring
    -Isrc/logging
    -Isrc/ai
extra_scripts = post:scripts/esp32_clean_reset.py

[env:esp32_devkit]
board = esp32dev

[env:esp32c3_devkit]
board = esp32-c3-devkitm-1

[env:esp32s3_devkit]
board = esp32-s3-devkitc-1

default_envs = esp32_devkit