; Qymera - qymera-IDF branch build configuration
;
; Native ESP-IDF build via PlatformIO convenience (framework = espidf).
; The authoritative build is `idf.py build` (ESP-IDF >= 5.0).
; This PlatformIO env exists so the Android/CI flow keeps working through a
; familiar entry point and does NOT download the Arduino frameworks at all.
;
; Native ESP-IDF layout: the application lives in `main/` (main/CMakeLists.txt)
; and the reusable Qymera library in components/qymera. Pointing src_dir at `main`
; avoids PlatformIO/IDF's "two different targets" conflict from the legacy root
; `src/` tree, which is kept only for historical reference and not compiled.
[platformio]
src_dir = main

[env:esp32_idf]
platform = espressif32@6.5.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_qymera.csv
build_flags =
    -DCONFIG_QYMERA_MATTER_ENABLE=0
