[env]
framework = arduino

[env:esp8266_generic]
platform = espressif8266
board = esp12e
monitor_speed = 74880
platform_packages =
    framework-arduinoespressif8266 @ 3.30102.0

[env:esp32_devkit]
platform = espressif32@6.5.0
board = esp32dev
monitor_speed = 115200
build_flags = -Wl,-Map,firmware.map
extra_scripts = post:scripts/esp32_clean_reset.py

[env:esp32c3_devkit]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags = -Wl,-Map,firmware.map
extra_scripts = post:scripts/esp32_clean_reset.py
